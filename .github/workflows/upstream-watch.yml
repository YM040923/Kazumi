name: Upstream Watch

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream-watch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate upstream sync report
        shell: pwsh
        run: |
          ./tools/upstream_sync_report.ps1 `
            -UpstreamRepo "Predidit/Kazumi" `
            -UpstreamBranch "main" `
            -BaseRef "HEAD" `
            -Output "upstream-sync-report.md"

      - name: Check whether upstream changed
        id: upstream
        shell: pwsh
        run: |
          $upstreamSha = git rev-parse refs/remotes/upstream-sync/main
          $currentSha = git rev-parse HEAD
          "upstream_sha=$upstreamSha" >> $env:GITHUB_OUTPUT
          "current_sha=$currentSha" >> $env:GITHUB_OUTPUT
          if ($upstreamSha -eq $currentSha) {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update upstream sync issue
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Upstream sync report: Predidit/Kazumi main';
            const report = fs.readFileSync('upstream-sync-report.md', 'utf8');
            const marker = '<!-- upstream-sync-report -->';
            const body = `${marker}\n${report}\n\n---\nGenerated by Upstream Watch.\nUpstream SHA: \`${{ steps.upstream.outputs.upstream_sha }}\`\nLocal SHA: \`${{ steps.upstream.outputs.current_sha }}\``;
            const {owner, repo} = context.repo;
            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: 'upstream-sync',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'upstream-sync',
                color: '0969da',
                description: 'Tracks upstream Predidit/Kazumi sync reports',
              });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'upstream-sync',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['upstream-sync'],
            });
